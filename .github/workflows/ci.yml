name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-secrets:
    name: Verificação de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Falhar se `.env` foi commitado
        run: |
          if [ -f .env ]; then
            echo "::error::Arquivo `.env` foi commitado — bloqueado."
            exit 1
          fi
          echo "OK: nenhum `.env` versionado."

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: no-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    needs: no-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: no-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest --cov=bncc_match --cov-report=term --cov-fail-under=90
