[project]
name = "bncc_match"
version = "0.1.0"
description = "Cruza o currículo da BNCC com vídeos do YouTube"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
data = "bncc_match.data_lake.cli:main"
bncc = "bncc_match.curriculum.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bncc_match"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["tests"]

[[tool.mypy.overrides]]
module = [
    "alembic",
    "alembic.*",
    "pdfplumber",
    "pdfplumber.*",
    "reportlab",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["bncc_match"]
branch = true

[tool.coverage.report]
show_missing = true
