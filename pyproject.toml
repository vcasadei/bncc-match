[project]
name = "bncc_match"
version = "0.1.0"
description = "Cruza o currículo da BNCC com vídeos do YouTube"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0.0"]

[project.scripts]
data = "bncc_match.data_lake.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bncc_match"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["bncc_match"]
branch = true

[tool.coverage.report]
show_missing = true
